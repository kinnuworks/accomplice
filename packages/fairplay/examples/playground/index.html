<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fairplay playground</title>
  <style>
    :root { --ink: #1d1a24; --paper: #f6f1e7; --brass: #b08a3e; --plum: #4a2e4f; --ok: #2f7a4b; --no: #a33b3b; --muted: #6b6474; --card: #fffaf0; --line: #d9cfbd; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ece6f0; --paper: #17131c; --card: #221c29; --muted: #a59bb0; --line: #3a3142; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--paper); color: var(--ink); }
    header { padding: 20px 16px; background: var(--plum); color: #f6f1e7; }
    header h1 { margin: 0; font-family: Georgia, serif; font-weight: 600; }
    header p { margin: 4px 0 0; opacity: .85; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 1.2rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
    input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); min-height: 40px; }
    button { background: var(--brass); color: #1d1a24; border: none; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    svg { width: 100%; height: auto; }
    .clue { display: flex; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); }
    .clue small { color: var(--muted); }
    .verdict { font-weight: 700; padding: 8px 12px; border-radius: 8px; display: inline-block; margin-top: 8px; }
    .follows { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
    .possible { background: color-mix(in srgb, var(--brass) 25%, transparent); }
    .contradicted { background: color-mix(in srgb, var(--no) 20%, transparent); color: var(--no); }
    ol li { margin-bottom: 6px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>fairplay playground</h1>
    <p>Generate a fair mystery, pin clues, and test your theory. Everything runs in your browser.</p>
  </header>
  <main>
    <section>
      <div class="controls">
        <label>Seed <input id="seed" type="number" value="2026" min="1"></label>
        <label>Tone <select id="tone"><option value="classic">Classic</option><option value="cozy">Cozy</option></select></label>
        <label>Difficulty <select id="difficulty"><option>1</option><option selected>2</option><option>3</option></select></label>
        <button id="go">Generate case</button>
        <button id="random" class="secondary">Surprise me</button>
      </div>
    </section>
    <section id="story"></section>
    <div class="grid2">
      <section><h2>Floor plan</h2><div id="plan"></div><div id="cast"></div></section>
      <section><h2>Clues</h2><p class="muted">Tick the clues you trust, then test a theory.</p><div id="clues"></div></section>
    </div>
    <section>
      <h2>Prove it</h2>
      <div class="controls">
        <label>Culprit <select id="culprit"></select></label>
        <label>Means <select id="item"><option value="">Any</option></select></label>
        <button id="prove">Test theory</button>
        <button id="all" class="secondary">Tick every clue</button>
        <button id="reveal" class="secondary">Show the solution</button>
      </div>
      <div id="verdict" role="status" aria-live="polite"></div>
      <div id="solution"></div>
    </section>
  </main>
  <script type="module" src="./playground.js"></script>
</body>
</html>
