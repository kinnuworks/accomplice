name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          FAIRPLAY_SEEDS: 200
      - run: npm run build
      - name: Benchmark (50 seeds per tone)
        run: npm run stats -- 50 | tee stats.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stats-node-${{ matrix.node }}
          path: stats.txt
