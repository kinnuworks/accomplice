<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accomplice evidence board</title>
<style>
  /*
    Built on the Alexa+ add-on base canvas: 768x480, one root scale.
    1rem = one base pixel, so the sizes below read exactly like the Alexa type tokens
    (Display2 40, Display5 24, Body1 16, Body3 12, Label1 10). On an Echo Show 8 or 15
    (1280x800) the root scale is 1.667.
  */
  html { font-size: calc(min(100vw / 768, 100vh / 480)); }
  :root {
    --page: #0B0D10;
    --card: #14181E;
    --inner: #1B2028;
    --text: #F5EDE0;
    --muted: #B8B0A6;
    --line: rgba(245, 237, 224, 0.14);
    --brand: #C9A24A;          /* brass: accents and the primary action only */
    --brand-ink: #17120A;
    --brand-text: #D9B65E;     /* brass used as text on dark */
    --secondary: #232F40;
    --paper: #F3E7CC;
    --paper-ink: #2A1F17;
    --good: #7FD39B;
    --bad: #FF9E8C;
    --serif: "Playfair Display", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Amazon Ember", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --type: "Special Elite", "American Typewriter", "Courier Prime", "Courier New", monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --page: #FAF9FB;
    --card: #FFFFFF;
    --inner: #F1EEF2;
    --text: #2A1F17;
    --muted: #5E5248;
    --line: rgba(42, 31, 23, 0.14);
    --brand-text: #7E5F17;
    --secondary: #E7E3EA;
    --good: #1E7A44;
    --bad: #B03A2A;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--page); color: var(--text); font-family: var(--sans); font-size: 16rem; line-height: 1.35; -webkit-font-smoothing: antialiased; }

  /* one card that fills the canvas, 24 base px in from the edges */
  #stage { position: absolute; inset: 0; padding: 20rem 24rem 16rem; display: flex; flex-direction: column; }
  .brandbar { display: flex; align-items: center; gap: 6rem; font-size: 12rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin-bottom: 12rem; }
  .brandbar i { width: 8rem; height: 8rem; border-radius: 9999rem; background: var(--brand); }
  .card { flex: 1; min-height: 0; background: var(--card); border-radius: 16rem; padding: 24rem; display: flex; gap: 24rem; align-items: center; box-shadow: 0 0 0 1rem var(--line); }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .kicker { font-size: 12rem; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-text); font-weight: 700; margin: 0 0 6rem; }
  h1 { font-family: var(--serif); font-size: 40rem; line-height: 1.08; margin: 0 0 12rem; font-weight: 700; text-wrap: balance; }
  h1.d5 { font-size: 24rem; line-height: 1.25; }
  .field { font-size: 16rem; color: var(--muted); margin: 0 0 6rem; text-wrap: pretty; }
  .field strong { color: var(--text); font-weight: 600; }
  .quote { font-family: var(--serif); font-size: 24rem; line-height: 1.28; margin: 0 0 8rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 12rem; align-items: center; margin-top: 16rem; }
  button.action {
    font: 700 16rem/1 var(--sans); color: var(--brand-ink); background: var(--brand);
    border: 0; border-radius: 9999rem; min-height: 48rem; min-width: 48rem; padding: 0 24rem; cursor: pointer;
  }
  button.action.secondary { background: var(--secondary); color: var(--text); }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3rem solid var(--brand); outline-offset: 3rem; }
  .say { margin-top: 12rem; font-size: 12rem; color: var(--muted); }
  .say q { color: var(--text); font-style: italic; }

  /* portraits */
  .portrait { flex: none; width: 120rem; height: 120rem; border-radius: 9999rem; overflow: hidden; background: var(--inner); box-shadow: 0 0 0 2rem var(--brand); display: grid; place-items: center; font: 700 32rem var(--serif); color: var(--muted); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait.sm { width: 64rem; height: 64rem; font-size: 20rem; box-shadow: 0 0 0 1.5rem var(--line); }

  /* list rows: 3 to 5 tiles, each a 48+ px target */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120rem, 1fr)); gap: 12rem; width: 100%; margin-top: 4rem; }
  .tile {
    font: inherit; color: inherit; text-align: left; cursor: pointer; min-height: 48rem;
    background: var(--inner); border: 0; border-radius: 12rem; padding: 12rem;
    display: flex; flex-direction: column; gap: 8rem; align-items: flex-start;
  }
  .tile:hover { box-shadow: 0 0 0 2rem var(--brand); }
  .tile .name { font-size: 16rem; font-weight: 700; line-height: 1.2; }
  .tile .role { font-size: 12rem; color: var(--muted); }

  /* the one paper accent: a clue card */
  .paper { background: var(--paper); color: var(--paper-ink); border-radius: 8rem; padding: 20rem 24rem; transform: rotate(-1deg); position: relative; max-width: 440rem; box-shadow: 0 8rem 24rem rgba(0,0,0,.35); }
  .paper::before { content: ""; position: absolute; top: -6rem; left: 50%; width: 12rem; height: 12rem; border-radius: 9999rem; background: #A8322A; }
  .paper .kicker { color: #7E5F17; }
  .paper h1 { color: var(--paper-ink); font-size: 24rem; margin-bottom: 8rem; }
  .paper p { margin: 0; font-size: 16rem; line-height: 1.4; }
  .clue-tile { background: var(--paper) !important; color: var(--paper-ink); }
  .clue-tile .role { color: #6B5641 !important; }
  .new { color: var(--brand-text); font-weight: 700; }

  .verdict-good { color: var(--good) !important; }
  .verdict-bad { color: var(--bad) !important; }
  .dots { display: inline-flex; gap: 6rem; margin-left: 8rem; vertical-align: middle; }
  .dots i { width: 8rem; height: 8rem; border-radius: 9999rem; background: var(--brand); animation: blink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .enter { animation: rise .25s cubic-bezier(0.05, 0.7, 0.1, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8rem); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .enter, .dots i { animation: none; } }
  .busy .card { opacity: .7; }


  /* ---- case file: a manila folder, the one paper object on this view ---- */
  .folder { position: relative; flex: 1; align-self: stretch; background: var(--paper); color: var(--paper-ink); border-radius: 4rem 12rem 12rem 12rem; padding: 24rem; display: flex; flex-direction: column; margin-top: 12rem; box-shadow: 0 8rem 24rem rgba(0,0,0,.3); }
  .folder::before { content: "CASE FILE"; position: absolute; top: -18rem; left: 0; height: 20rem; padding: 4rem 16rem 0; border-radius: 8rem 8rem 0 0; background: var(--paper); font: 700 10rem/1.6 var(--type); letter-spacing: .12em; color: #6B5641; }
  .folder .kicker { color: #7E5F17; font-family: var(--type); letter-spacing: .06em; }
  .folder h1 { color: var(--paper-ink); }
  .folder .field { color: #5E4A3A; }
  .folder .field strong { color: var(--paper-ink); }
  .lineup { display: flex; gap: 8rem; margin-top: 8rem; }
  .lineup .portrait { width: 48rem; height: 48rem; box-shadow: 0 0 0 2rem var(--paper), 0 0 0 3rem rgba(43,29,20,.25); }
  .card.bare { background: transparent; box-shadow: none; padding: 0; }

  /* ---- verdict stamp: real rubber-stamp inks, a shape and a word per verdict ---- */
  .sheet { position: relative; flex: 1; align-self: stretch; background: var(--paper); color: var(--paper-ink); border-radius: 8rem; padding: 24rem; display: flex; gap: 24rem; align-items: center; box-shadow: 0 8rem 24rem rgba(0,0,0,.3); }
  .sheet h1 { color: var(--paper-ink); }
  .sheet .field { color: #5E4A3A; }
  .sheet .kicker { font-family: var(--type); color: #6B5641; }
  .stamp { position: absolute; right: 28rem; top: 22rem; font: 700 20rem/1 var(--type); letter-spacing: .08em; text-transform: uppercase; display: grid; place-items: center; text-align: center; filter: url(#ink); opacity: .9; transform: rotate(-9deg); animation: slam .32s cubic-bezier(.2,1.6,.4,1) both .25s; }
  .stamp.proven { color: #1D4F91; width: 132rem; height: 132rem; border-radius: 9999rem; border: 5rem solid currentColor; box-shadow: inset 0 0 0 3rem var(--paper), inset 0 0 0 5rem currentColor; }
  .stamp.ruled { color: #A8231B; padding: 12rem 16rem; border: 4rem solid currentColor; }
  .stamp.ruled::after { content: ""; position: absolute; left: -6rem; right: -6rem; top: 50%; height: 4rem; background: currentColor; transform: rotate(-14deg); }
  .stamp small { display: block; font-size: 10rem; letter-spacing: .14em; margin-top: 4rem; }
  @keyframes slam { 0% { opacity: 0; transform: rotate(-9deg) scale(1.35); } 70% { opacity: .95; transform: rotate(-9deg) scale(.97); } 100% { opacity: .9; transform: rotate(-9deg) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }

  /* ---- record and handoff ---- */
  .stats { display: flex; gap: 12rem; margin: 4rem 0 8rem; }
  .stat { background: var(--inner); border-radius: 12rem; padding: 12rem 16rem; min-width: 104rem; }
  .stat b { display: block; font: 700 32rem/1.05 var(--serif); color: var(--text); }
  .stat span { font-size: 12rem; color: var(--muted); }
  .code { font: 700 48rem/1 var(--type); letter-spacing: .3em; color: var(--text); margin: 4rem 0 12rem; }
  .qr { flex: none; width: 152rem; height: 152rem; background: #fff; border-radius: 12rem; padding: 8rem; }
  .qr img { width: 100%; height: 100%; display: block; }
  .tvglyph { flex: none; width: 152rem; height: 112rem; border: 4rem solid var(--brand); border-radius: 10rem; display: grid; place-items: center; font: 700 24rem var(--type); color: var(--brand-text); position: relative; }
  .tvglyph::after { content: ""; position: absolute; bottom: -20rem; left: 50%; width: 56rem; height: 4rem; margin-left: -28rem; background: var(--brand); border-radius: 4rem; }

  /* smaller hosts (phone or web) get a compact layout */
  .dc-mobile .card { flex-direction: column; align-items: flex-start; }
  .dc-mobile .portrait { width: 72rem; height: 72rem; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 .85 1 1"/></feComponentTransfer></filter>
</svg>
<main id="stage" aria-live="polite"></main>
<script>
(() => {
  'use strict';
  const PROTOCOL = '2026-01-26';
  const stage = document.getElementById('stage');
  const root = document.documentElement;
  let last = null;
  let nextId = 1;
  const pending = new Map();

  // ---------- MCP Apps bridge (view side), JSON-RPC 2.0 over postMessage ----------
  const host = window.parent !== window ? window.parent : null;
  function send(msg) { if (host) host.postMessage(msg, '*'); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: '2.0', id, method, params });
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      setTimeout(() => { if (pending.delete(id)) reject(new Error('The display did not answer in time.')); }, 30000);
    });
  }
  function notify(method, params) { send({ jsonrpc: '2.0', method, params: params || {} }); }

  window.addEventListener('message', (e) => {
    if (host && e.source !== host) return;
    const m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id !== undefined && !m.method) {
      const p = pending.get(m.id); if (!p) return; pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error.message || 'Something went wrong.')); else p.resolve(m.result);
      return;
    }
    switch (m.method) {
      case 'ui/notifications/tool-input': showWorking(m.params && m.params.arguments); break;
      case 'ui/notifications/tool-input-partial': break;
      case 'ui/notifications/tool-result': renderResult(m.params); break;
      case 'ui/notifications/tool-cancelled': render(last || { view: 'empty' }); break;
      case 'ui/notifications/host-context-changed': applyContext(m.params); break;
      case 'ui/resource-teardown': send({ jsonrpc: '2.0', id: m.id, result: {} }); break;
      case 'ping': send({ jsonrpc: '2.0', id: m.id, result: {} }); break;
      default: if (m.id !== undefined) send({ jsonrpc: '2.0', id: m.id, error: { code: -32601, message: 'Method not found' } });
    }
  });

  // theme and breakpoint come from the host; fall back to the system setting
  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) root.dataset.theme = ctx.theme;
    if (ctx.locale) root.lang = ctx.locale;
    const w = ctx.containerDimensions && (ctx.containerDimensions.width || ctx.containerDimensions.maxWidth);
    const cls = ctx.platform === 'mobile' || (w && w < 600) ? 'dc-mobile' : (w && w >= 960) ? 'dc-echo-show' : 'dc-web';
    root.classList.remove('dc-mobile', 'dc-echo-show', 'dc-web');
    root.classList.add(cls);
    const s = ctx.safeAreaInsets;
    if (s) stage.style.padding = `calc(20rem + ${s.top}px) calc(24rem + ${s.right}px) calc(16rem + ${s.bottom}px) calc(24rem + ${s.left}px)`;
  }
  if (!root.dataset.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) root.dataset.theme = 'light';

  async function callTool(name, args) {
    stage.classList.add('busy');
    try {
      renderResult(await request('tools/call', { name, arguments: args || {} }));
    } catch (err) {
      render({ view: 'notice', speech: err && err.message ? err.message : 'That did not work. Try again in a moment.' });
    } finally {
      stage.classList.remove('busy');
    }
  }

  // ---------- tiny DOM helper (text only, never innerHTML for data) ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;
  }
  const initials = (name) => (name || '?').replace(/^(mrs?\.?|ms\.?|miss|dr\.?|lord|lady|sir)\s+/i, '').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  function portrait(s, small) {
    const box = h('div', { class: small ? 'portrait sm' : 'portrait' });
    if (s && s.portraitUrl) {
      const img = h('img', { src: s.portraitUrl, alt: `Painted portrait of ${s.name}${s.role ? `, ${s.role}` : ''}` });
      img.onerror = () => { box.textContent = initials(s.name); box.setAttribute('aria-hidden', 'true'); };
      box.append(img);
    } else { box.textContent = initials(s && s.name); box.setAttribute('aria-hidden', 'true'); }
    return box;
  }
  const caseNo = (id) => { let n = 7; for (const ch of String(id || '')) n = (n * 31 + ch.charCodeAt(0)) % 9973; return String(n).padStart(4, '0'); };
  const action = (label, fn, secondary) => h('button', { class: secondary ? 'action secondary' : 'action', onclick: fn }, label);
  const say = (text) => h('p', { class: 'say' }, 'Try saying ', h('q', {}, text));

  // ---------- views: one title, one or two fields, one action ----------
  function renderResult(result) {
    if (!result) return;
    const sc = result.structuredContent;
    if (sc && sc.view) return render(sc);
    const text = (result.content || []).filter((c) => c.type === 'text').map((c) => c.text).join(' ');
    render({ view: 'notice', speech: text || 'Done.' });
  }

  function showWorking(args) {
    const tone = args && args.tone;
    paint([h('div', { class: 'col' },
      h('p', { class: 'kicker' }, 'One moment'),
      h('h1', {}, 'Working on it', h('span', { class: 'dots', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'))),
      tone ? h('p', { class: 'field' }, tone === 'cozy' ? 'Baking a cozy little mystery.' : 'Setting a classic parlour mystery.') : null)]);
  }

  const views = {
    empty: () => [h('div', { class: 'col' },
      h('p', { class: 'kicker' }, 'A mystery for the whole room'),
      h('h1', {}, 'No case open yet'),
      h('p', { class: 'field' }, 'Question the suspects out loud. One of you might be in on it.'),
      h('div', { class: 'actions' }, action('Start a case', () => callTool('start_case', { tone: 'classic' }))),
      say('Start a cozy case'))],

    case: (d) => {
      const c = d.case || {};
      const lineup = (d.suspects || []).slice(0, 5);
      const progress = d.progress;
      return [h('article', { class: 'folder' },
        h('p', { class: 'kicker' }, d.resumed ? 'Welcome back' : d.weekly ? 'Case of the week' : c.solved ? 'Case closed' : `No. ${caseNo(c.id)}${c.round ? ` · round ${c.round}` : ''}`),
        h('h1', {}, c.title || 'The case'),
        h('p', { class: 'field' }, h('strong', {}, `${c.victim ? c.victim.name : 'Someone'} ${c.crime ? c.crime.what : ''}`), c.crime ? ` in ${c.crime.room} at ${c.crime.time}.` : ''),
        progress && progress.questionsAsked
          ? h('p', { class: 'field' }, `You had asked ${progress.questionsAsked} question${progress.questionsAsked === 1 ? '' : 's'}. ${c.boardClueCount || 0} clues on the board.`)
          : h('p', { class: 'field' }, `${c.suspectCount || 0} suspects, ${c.boardClueCount || 0} clues on the board.`),
        lineup.length ? h('div', { class: 'lineup', 'aria-label': 'Suspects' }, lineup.map((x) => portrait(x, true))) : null,
        h('div', { class: 'actions' }, c.solved
          ? action('Play again', () => callTool('start_case', { tone: c.tone || 'classic' }))
          : action('Meet the suspects', () => callTool('list_suspects', {}))),
        h('p', { class: 'say', style: 'color:#5E4A3A' }, 'Try saying ', h('q', { style: 'color:#2B1D14' }, c.solved ? 'Start a new case' : 'Who are the suspects?')))];
    },

    suspects: (d) => [h('div', { class: 'col' },
      h('p', { class: 'kicker' }, 'Suspects'),
      h('h1', { class: 'd5' }, 'Who will you question?'),
      h('div', { class: 'tiles' }, (d.suspects || []).slice(0, 5).map((s) =>
        h('button', { class: 'tile', 'aria-label': `Question ${s.name}, ${s.role}`, onclick: () => callTool('question_suspect', { suspect: s.id, question: 'Where were you when it happened?' }) },
          portrait(s, true), h('span', { class: 'name' }, s.name), h('span', { class: 'role' }, s.role)))),
      say(d.suspects && d.suspects[0] ? `Ask ${d.suspects[0].role} where they were` : 'Ask the cook where she was'))],

    reply: (d) => {
      const s = d.suspect || {};
      return [portrait(s), h('div', { class: 'col' },
        h('p', { class: 'kicker' }, `${s.name || 'Suspect'}, ${s.role || ''}`),
        h('p', { class: 'quote' }, `“${d.answer || d.speech}”`),
        d.question ? h('p', { class: 'field' }, 'You asked: ', h('strong', {}, d.question)) : null,
        h('div', { class: 'actions' }, action('Ask someone else', () => callTool('list_suspects', {}))),
        say(`${(s.name || '').split(' ').slice(-1)[0] || 'Suspect'}, did you see anything?`))];
    },

    clue: (d) => {
      const c = d.clue || {};
      return [h('div', { class: 'col' },
        h('article', { class: 'paper' },
          h('p', { class: 'kicker' }, c.kind === 'document' ? 'Document' : c.kind === 'testimony' ? 'Witness' : 'Evidence'),
          h('h1', {}, c.title),
          h('p', {}, c.text)),
        h('div', { class: 'actions' }, action('All clues', () => callTool('examine_clue', {}))),
        say('Give me a hint'))];
    },

    clues: (d) => [h('div', { class: 'col' },
      h('p', { class: 'kicker' }, d.round ? `Evidence board · round ${d.round}` : 'Evidence board'),
      h('h1', { class: 'd5' }, d.clues && d.clues.length ? `${d.clues.length} clues pinned` : 'Nothing pinned yet'),
      h('div', { class: 'tiles' }, (d.clues || []).slice(0, 5).map((c) =>
        h('button', { class: 'tile clue-tile', 'aria-label': `Read ${c.title}`, onclick: () => callTool('examine_clue', { clue: c.id }) },
          h('span', { class: 'role' }, (d.newClueIds || []).includes(c.id) ? h('span', { class: 'new' }, 'New') : null, (d.newClueIds || []).includes(c.id) ? ' · ' : '', c.kind),
          h('span', { class: 'name' }, c.title)))),
      say(d.clues && d.clues[0] ? `Examine ${d.clues[0].title.toLowerCase()}` : 'Next round'))],

    hint: (d) => [h('div', { class: 'col' },
      h('p', { class: 'kicker' }, 'A gentle nudge'),
      h('h1', { class: 'd5' }, (d.hint && d.hint.text) || d.speech),
      d.clue ? h('p', { class: 'field' }, 'Look at ', h('strong', {}, d.clue.title), '.') : null,
      h('div', { class: 'actions' }, d.clue
        ? action('Read that clue', () => callTool('examine_clue', { clue: d.clue.id }))
        : action('Show the case', () => callTool('case_summary', {}))),
      say('Give me another hint'))],

    confirm: (d) => {
      const s = d.suspect || {};
      return [portrait(s), h('div', { class: 'col' },
        h('p', { class: 'kicker' }, 'Final answer?'),
        h('h1', {}, `Accuse ${s.name || 'them'}?`),
        h('p', { class: 'field' }, d.item ? `With ${d.item.name}. ` : '', 'This ends the case.'),
        h('div', { class: 'actions' },
          action('Yes, accuse', () => callTool('accuse', { culprit: d.culprit || s.id, item: d.itemId, confirmed: true })),
          action('Not yet', () => callTool('case_summary', {}), true)),
        say('Yes, accuse'))];
    },

    verdict: (d) => {
      const r = d.result || {};
      const who = d.culprit || { name: r.culprit && r.culprit.name };
      return [h('article', { class: 'sheet' },
        portrait(who),
        h('div', { class: 'col' },
          h('p', { class: 'kicker' }, d.caseTitle || 'The verdict'),
          h('h1', {}, r.culprit ? r.culprit.name : 'The culprit'),
          h('p', { class: 'field' }, r.explanation || (r.means ? `With ${r.means.name}.` : '')),
          h('div', { class: 'actions' }, action('Continue on your Fire TV', () => callTool('send_to_tv', {}))),
          h('p', { class: 'say', style: 'color:#5E4A3A' }, 'Try saying ', h('q', { style: 'color:#2B1D14' }, 'How are we doing?'))),
        r.correct
          ? h('div', { class: 'stamp proven', role: 'img', 'aria-label': 'Stamped: case closed, you solved it' }, h('span', {}, 'Case', h('br'), 'closed', h('small', {}, 'solved')))
          : h('div', { class: 'stamp ruled', role: 'img', 'aria-label': 'Stamped: ruled out, wrong suspect' }, h('span', {}, 'Ruled out')))];
    },

    record: (d) => {
      const r = d.record || {};
      const fav = r.favouriteSuspect;
      const open = r.lastCase && !r.lastCase.finished;
      return [h('div', { class: 'col' },
        h('p', { class: 'kicker' }, 'Detective record'),
        h('h1', { class: 'd5' }, r.casesStarted ? (r.streak > 1 ? `${r.streak} in a row. Nicely done.` : 'Your career so far') : 'A clean slate'),
        h('div', { class: 'stats' },
          h('div', { class: 'stat' }, h('b', {}, String(r.solved || 0)), h('span', {}, 'solved')),
          h('div', { class: 'stat' }, h('b', {}, String(r.streak || 0)), h('span', {}, 'streak')),
          h('div', { class: 'stat' }, h('b', {}, String(r.casesStarted || 0)), h('span', {}, 'cases opened'))),
        fav ? h('p', { class: 'field' }, 'Favourite suspect to question: ', h('strong', {}, fav.name), '.') : null,
        h('div', { class: 'actions' }, open
          ? action(`Finish ${r.lastCase.title}`, () => callTool('resume_case', {}))
          : action('Start a case', () => callTool('start_case', { tone: 'classic' }))),
        say(open ? "Let's finish last night's case" : 'Start the case of the week'))];
    },

    handoff: (d) => [
      d.qrUrl ? h('div', { class: 'qr' }, h('img', { src: d.qrUrl, alt: 'QR code to join on a phone' })) : h('div', { class: 'tvglyph', 'aria-hidden': 'true' }, 'TV'),
      h('div', { class: 'col' },
        h('p', { class: 'kicker' }, d.caseTitle || 'Your case'),
        h('h1', {}, 'Continue on your Fire TV'),
        h('p', { class: 'field' }, 'Open Accomplice on the TV and enter this code. Phones join with it too.'),
        h('p', { class: 'code', 'aria-label': `Room code ${(d.roomCode || '').split('').join(' ')}` }, d.roomCode || '----'),
        h('div', { class: 'actions' }, action('Back to the case', () => callTool('case_summary', {}))))],

    notice: (d) => [h('div', { class: 'col' },
      h('p', { class: 'kicker' }, 'Accomplice'),
      h('h1', { class: 'd5' }, d.speech || 'Done.'),
      h('div', { class: 'actions' }, action('Show the case', () => callTool('case_summary', {}))))],
  };

  function paint(children) {
    stage.replaceChildren(
      h('div', { class: 'brandbar' }, h('i', { 'aria-hidden': 'true' }), 'ACCOMPLICE'),
      h('section', { class: (children[0] && /folder|sheet/.test(children[0].className || '')) ? 'card bare enter' : 'card enter' }, children));
    notify('ui/notifications/size-changed', { width: root.scrollWidth, height: root.scrollHeight });
  }
  function render(data) {
    last = data;
    paint((views[data.view] || views.notice)(data));
  }

  // ---------- start ----------
  render({ view: 'empty' });
  if (host) {
    request('ui/initialize', {
      appInfo: { name: 'accomplice-board', version: '0.3.0' },
      appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
      protocolVersion: PROTOCOL,
    }).then((res) => {
      applyContext(res && res.hostContext);
      notify('ui/notifications/initialized', {});
    }).catch(() => { /* the board still renders without a host */ });
  }
})();
</script>
</body>
</html>
