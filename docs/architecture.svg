<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" width="1240" height="710" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Accomplice on AWS</title>
  <desc>Devices reach one HTTPS address: by default a Cloudflare quick tunnel into the Fargate task, optionally Amazon CloudFront. The task which calls Polly, Transcribe, Translate, DynamoDB, S3, Secrets Manager and CloudWatch.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.5; }
      .dev { fill: #f7fafc; stroke: #a0aec0; stroke-width: 1.5; }
      .edge { fill: #f3e8ff; stroke: #805ad5; stroke-width: 1.5; }
      .comp { fill: #fff7e6; stroke: #dd6b20; stroke-width: 1.5; }
      .data { fill: #e6fffa; stroke: #2c7a7b; stroke-width: 1.5; }
      .ai { fill: #ebf8ff; stroke: #3182ce; stroke-width: 1.5; }
      .ops { fill: #fff5f7; stroke: #c53030; stroke-width: 1.5; }
      .ext { fill: #ffffff; stroke: #718096; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .h { font-size: 15px; font-weight: 700; fill: #1a202c; }
      .t { font-size: 12px; fill: #4a5568; }
      .l { font-size: 11px; fill: #2d3748; }
      .line { stroke: #4a5568; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dash { stroke: #718096; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1240" height="710" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1a202c">Accomplice on AWS</text>
  <text x="30" y="62" class="t">Region ap-south-1 (Mumbai). Narrator generative voices from us-east-1. One HTTPS address for every screen, printed by infra/scripts/url.sh.</text>

  <!-- devices -->
  <rect x="30" y="110" width="190" height="80" rx="10" class="dev"/>
  <text x="46" y="138" class="h">TV</text>
  <text x="46" y="158" class="t">Fire TV or any browser</text>
  <text x="46" y="176" class="t">/tv, plays voices, captions</text>
  <rect x="30" y="220" width="190" height="80" rx="10" class="dev"/>
  <text x="46" y="248" class="h">Phones</text>
  <text x="46" y="268" class="t">/p, private clues, voting,</text>
  <text x="46" y="286" class="t">push to talk microphone</text>
  <rect x="30" y="330" width="190" height="80" rx="10" class="dev"/>
  <text x="46" y="358" class="h">Echo / voice add-on</text>
  <text x="46" y="378" class="t">/mcp tools and /echo</text>
  <text x="46" y="396" class="t">simulator</text>

  <!-- CloudFront -->
  <rect x="280" y="190" width="200" height="140" rx="10" class="edge"/>
  <text x="296" y="218" class="h">HTTPS entry</text>
  <text x="296" y="240" class="t">default: Cloudflare quick</text>
  <text x="296" y="258" class="t">tunnel into the task</text>
  <text x="296" y="280" class="t">option: Amazon CloudFront</text>
  <text x="296" y="298" class="t">(cdn=true, needs account</text>
  <text x="296" y="316" class="t">verification by AWS)</text>

  <!-- ALB -->
  <rect x="540" y="215" width="160" height="90" rx="10" class="comp"/>
  <text x="556" y="243" class="h">Load Balancer</text>
  <text x="556" y="263" class="t">ALB, plain HTTP</text>
  <text x="556" y="281" class="t">health checks, deploys</text>

  <!-- Fargate -->
  <rect x="760" y="160" width="200" height="200" rx="10" class="comp"/>
  <text x="776" y="188" class="h">ECS on Fargate</text>
  <text x="776" y="208" class="t">1 task, ARM, 0.5 vCPU, 1 GB</text>
  <text x="776" y="234" class="l">Node game server</text>
  <text x="776" y="252" class="l">/ws game state</text>
  <text x="776" y="270" class="l">/stt live speech</text>
  <text x="776" y="288" class="l">/api, /mcp</text>
  <text x="776" y="306" class="l">fair play checker</text>
  <text x="776" y="324" class="l">voice and caption pipeline</text>
  <text x="776" y="342" class="l">cloudflared tunnel, metrics</text>

  <!-- AI services -->
  <rect x="1020" y="80" width="200" height="72" rx="10" class="ai"/>
  <text x="1036" y="106" class="h">Amazon Polly</text>
  <text x="1036" y="125" class="t">neural suspects, generative</text>
  <text x="1036" y="141" class="t">narrator, speech marks</text>
  <rect x="1020" y="168" width="200" height="72" rx="10" class="ai"/>
  <text x="1036" y="194" class="h">Amazon Transcribe</text>
  <text x="1036" y="213" class="t">streaming, players ask</text>
  <text x="1036" y="229" class="t">suspects out loud</text>
  <rect x="1020" y="256" width="200" height="72" rx="10" class="ai"/>
  <text x="1036" y="282" class="h">Amazon Translate</text>
  <text x="1036" y="301" class="t">per player language</text>
  <text x="1036" y="317" class="t">(English and Hindi)</text>
  <rect x="1020" y="344" width="200" height="72" rx="10" class="ext"/>
  <text x="1036" y="370" class="h">Language model API</text>
  <text x="1036" y="389" class="t">outside AWS, key from</text>
  <text x="1036" y="405" class="t">Secrets Manager</text>

  <!-- data and ops row -->
  <rect x="280" y="470" width="200" height="110" rx="10" class="data"/>
  <text x="296" y="498" class="h">Amazon S3</text>
  <text x="296" y="518" class="t">voice cache (audio/)</text>
  <text x="296" y="536" class="t">web apps with cdn=true</text>
  <text x="296" y="554" class="t">private bucket</text>
  <rect x="540" y="470" width="190" height="110" rx="10" class="data"/>
  <text x="556" y="498" class="h">Amazon DynamoDB</text>
  <text x="556" y="518" class="t">on demand, two tables</text>
  <text x="556" y="536" class="t">room snapshots, results,</text>
  <text x="556" y="554" class="t">fair play audit, records</text>
  <rect x="760" y="470" width="200" height="110" rx="10" class="ops"/>
  <text x="776" y="498" class="h">Secrets Manager</text>
  <text x="776" y="518" class="t">API keys injected at start</text>
  <text x="776" y="536" class="t">never in image or code</text>
  <rect x="1000" y="470" width="220" height="110" rx="10" class="ops"/>
  <text x="1016" y="498" class="h">Amazon CloudWatch</text>
  <text x="1016" y="518" class="t">logs, metrics, dashboard</text>
  <text x="1016" y="536" class="t">rooms, questions,</text>
  <text x="1016" y="554" class="t">answer latency p50 / p95</text>

  <!-- budgets footer -->
  <rect x="30" y="615" width="1190" height="64" rx="10" class="box"/>
  <text x="46" y="642" class="h">AWS Budgets: red-herring-cap, $150 per month</text>
  <text x="46" y="662" class="t">Watches the whole account. Expected spend about $48 a month fixed plus about $0.30 to $0.45 of AWS services per game.</text>

  <!-- arrows: devices to CloudFront -->
  <path class="line" d="M220,150 C250,150 250,230 278,230"/>
  <path class="line" d="M220,260 L278,260"/>
  <path class="line" d="M220,370 C250,370 250,290 278,290"/>
  <!-- CloudFront to ALB and S3 -->
  <path class="line" d="M480,260 L538,260"/>
  <text x="484" y="250" class="l">cdn=true</text>
  <text x="484" y="282" class="l">origin</text>
  <!-- default: tunnel straight into the task -->
  <path class="line" d="M470,190 C560,120 690,120 770,158"/>
  <text x="560" y="118" class="l">default: HTTPS tunnel to the task (WSS included)</text>
  <path class="dash" d="M380,330 L380,468"/>
  <text x="388" y="372" class="l">cdn=true: static</text>
  <text x="388" y="388" class="l">files from S3</text>
  <!-- S3 miss falls back to the ALB -->
  <path class="dash" d="M480,482 C520,460 560,400 600,307"/>
  <text x="392" y="432" class="l">miss: fall back</text>
  <text x="392" y="446" class="l">to the server</text>
  <!-- ALB to Fargate -->
  <path class="line" d="M700,260 L758,260"/>
  <!-- Fargate to AI services -->
  <path class="line" d="M960,190 C990,190 990,116 1018,116"/>
  <path class="line" d="M960,220 C990,220 990,204 1018,204"/>
  <path class="line" d="M960,270 C990,270 990,292 1018,292"/>
  <path class="dash" d="M960,320 C990,320 990,380 1018,380"/>
  <!-- Fargate to data and ops -->
  <path class="dash" d="M770,360 C700,430 560,440 482,545"/>
  <text x="664" y="398" class="l">voice cache</text>
  <path class="line" d="M820,360 C800,420 680,420 650,468"/>
  <path class="line" d="M860,360 L860,468"/>
  <path class="line" d="M930,360 C960,420 1080,420 1100,468"/>
</svg>
